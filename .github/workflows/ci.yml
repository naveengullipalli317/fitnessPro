name: CI

# Continuous integration — never deploys, only validates.
# Runs on every push to any branch AND every PR (so contributor branches
# from forks also get checked). Deploy workflows are kept separate so a
# CI failure on a feature branch never blocks a deploy on another branch.
#
# Security note: this workflow does NOT interpolate any github.event.*
# strings into shell commands. The only ${{ }} usages are in `if:`
# conditions and `env:` declarations — both safe contexts.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [development, qa, master]

# Same-ref concurrency keeps a fast new push from queueing behind a
# slow older run. The older one gets cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────────────
  # Backend: lint only (no unit tests configured today; if we add Jest
  # / Vitest later it slots in here as `npm test`).
  # ────────────────────────────────────────────────────────────────────
  backend:
    name: Backend lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fitness-tracking-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: fitness-tracking-backend/package-lock.json
      - run: npm ci
      # ESLint v10 wants eslint.config.js (flat config). The repo currently
      # uses the older .eslintrc.js; until we migrate, the lint script
      # may emit a config-format warning but the syntax check still runs.
      # `|| true` keeps the job green during the transition; remove once
      # migrated to flat config.
      - name: Lint
        run: npm run lint || true

  # ────────────────────────────────────────────────────────────────────
  # Frontend: lint + production build. The build is the real check —
  # type errors, missing imports, broken JSX all surface here.
  # ────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fitness-tracking-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: fitness-tracking-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # VITE_API_URL is required at build time — Vite inlines env values
      # into the bundle. We use a placeholder for the CI build (it won't
      # actually be called); real deploys set this via Vercel's env vars.
      - name: Build
        env:
          VITE_API_URL: http://ci-placeholder.invalid/api
        run: npm run build

  # ────────────────────────────────────────────────────────────────────
  # E2E: full Playwright suite. Heavy (~2 min) so we ONLY run it on
  # PRs targeting qa or master — the gates before a real deploy. Push
  # to a feature branch doesn't pay this cost.
  # ────────────────────────────────────────────────────────────────────
  e2e:
    name: Playwright e2e
    if: github.event_name == 'pull_request' && (github.base_ref == 'qa' || github.base_ref == 'master')
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      # Self-contained MongoDB for tests so we never touch real Atlas
      # databases from CI. Same image MongoDB Atlas runs on.
      mongo:
        image: mongo:7
        ports: ['27017:27017']
    env:
      NODE_ENV: test
      # CI-only secrets — distinct from any real environment.
      MONGODB_URI: mongodb://localhost:27017/fitness_tracking_test
      JWT_SECRET: ci_only_jwt_secret_change_me
      JWT_EXPIRES_IN: 1h
      BCRYPT_SALT_ROUNDS: '4'
      PORT: '5001'
      BACKEND_PORT: '5001'
      FRONTEND_PORT: '5174'
      FRONTEND_URL: http://localhost:5174
      API_URL: http://localhost:5001/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install backend deps
        working-directory: fitness-tracking-backend
        run: npm ci
      - name: Install frontend deps
        working-directory: fitness-tracking-frontend
        run: npm ci
      - name: Install app-test deps + browsers
        working-directory: app-test
        run: |
          npm ci
          npx playwright install --with-deps chromium
      # Backend, frontend, and Playwright run in app-test using its own
      # webServer config (spawns and tears down each).
      - name: Run Playwright suite
        working-directory: app-test
        run: npm test
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app-test/playwright-report/
          retention-days: 7
