name: Deploy

# Deploys frontend (Vercel) and backend (Render) to the environment that
# matches the branch being pushed. CI runs separately; this workflow
# assumes CI already passed (it doesn't re-run lint/build itself).
#
# Branch -> Environment mapping:
#   development -> dev   (auto, no approval)
#   qa          -> qa    (auto, no approval)
#   master      -> prod  (requires manual approval via GitHub Environment)
#
# The GitHub Environment "prod" should be configured in repo settings with
# at least one required reviewer — that is what gates the master deploy
# behind a human approval click.
#
# Security note: every ${{ github.* }} usage in this file goes through an
# env: declaration before being referenced in shell. No user-controllable
# input is interpolated directly into a run: command.
on:
  push:
    branches: [development, qa, master]

# A new push to the same branch supersedes an in-flight deploy.
# We do NOT cancel-in-progress for prod (master) — letting a prod deploy
# finish even if a newer commit lands is safer than half-deployed state.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  resolve:
    name: Resolve environment
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.set.outputs.env_name }}
      is_prod: ${{ steps.set.outputs.is_prod }}
    steps:
      - id: set
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" = "refs/heads/master" ]; then
            echo "env_name=prod" >> "$GITHUB_OUTPUT"
            echo "is_prod=true"  >> "$GITHUB_OUTPUT"
          elif [ "$REF" = "refs/heads/qa" ]; then
            echo "env_name=qa"   >> "$GITHUB_OUTPUT"
            echo "is_prod=false" >> "$GITHUB_OUTPUT"
          else
            echo "env_name=dev"  >> "$GITHUB_OUTPUT"
            echo "is_prod=false" >> "$GITHUB_OUTPUT"
          fi

  frontend:
    name: Deploy frontend (Vercel)
    runs-on: ubuntu-latest
    needs: resolve
    environment: ${{ needs.resolve.outputs.env_name }}
    defaults:
      run:
        working-directory: fitness-tracking-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Vercel CLI
        run: npm i -g vercel@latest
      - name: Pull Vercel env / config for this environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          IS_PROD: ${{ needs.resolve.outputs.is_prod }}
        run: |
          if [ "$IS_PROD" = "true" ]; then
            vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          else
            vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          fi
      - name: Build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          IS_PROD: ${{ needs.resolve.outputs.is_prod }}
        run: |
          if [ "$IS_PROD" = "true" ]; then
            vercel build --prod --token="$VERCEL_TOKEN"
          else
            vercel build --token="$VERCEL_TOKEN"
          fi
      - name: Deploy prebuilt artifacts
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          IS_PROD: ${{ needs.resolve.outputs.is_prod }}
        run: |
          if [ "$IS_PROD" = "true" ]; then
            vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
          else
            vercel deploy --prebuilt --token="$VERCEL_TOKEN"
          fi

  backend:
    name: Deploy backend (Render)
    runs-on: ubuntu-latest
    needs: resolve
    environment: ${{ needs.resolve.outputs.env_name }}
    steps:
      - name: Trigger Render deploy
        env:
          # RENDER_DEPLOY_HOOK is set per GitHub Environment.
          # Format: https://api.render.com/deploy/srv-XXX?key=YYY
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::RENDER_DEPLOY_HOOK secret not set for this environment"
            exit 1
          fi
          # Render returns 200 immediately; the actual build runs async on
          # their side. The smoke-check job below verifies the result.
          curl -fsSL -X POST "$HOOK"
          echo ""
          echo "Triggered Render deploy. Watch progress at https://dashboard.render.com"

  smoke-check:
    name: Post-deploy smoke check
    runs-on: ubuntu-latest
    needs: [resolve, frontend, backend]
    environment: ${{ needs.resolve.outputs.env_name }}
    steps:
      # The deployed backend URL lives in a GitHub Environment secret
      # so it scales per env (dev.api.nevergiveup.app etc).
      - name: Wait for backend health
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          MAX_ATTEMPTS: '30'
          SLEEP_SECONDS: '5'
        run: |
          # Poll /api/health until it reports {status:OK, db:connected}.
          # Render free-tier cold-starts can take up to ~60s; paid tiers
          # are much faster. 30 attempts × 5s = 2.5 min upper bound is
          # comfortable for free, harmless for paid. Tuning notes in
          # DEPLOYMENT.md (give-up time, log redaction, etc.).
          attempt=1
          while [ "$attempt" -le "$MAX_ATTEMPTS" ]; do
            response=$(curl -fsS "$BACKEND_URL/api/health" 2>/dev/null || true)
            if grep -q '"status":"OK"' <<< "$response" \
              && grep -q '"db":"connected"' <<< "$response"; then
              echo "healthy on attempt $attempt"
              exit 0
            fi
            echo "attempt $attempt/$MAX_ATTEMPTS not ready yet"
            sleep "$SLEEP_SECONDS"
            attempt=$((attempt + 1))
          done
          echo "::error::Backend did not become healthy after $MAX_ATTEMPTS attempts"
          exit 1
